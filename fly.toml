# fly.toml app configuration file for the OpenVitals landing page.
#
# See https://fly.io/docs/reference/configuration/ for information about this file.

app = 'openvitals-health'
primary_region = 'arn'

[build]

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
